<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Haden Walton Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <style>

      /*Small screen support*/
      @media screen and (min-width:320px) {
        body {
          /* background-color: #c29718; */
          grid-template-rows: 15% 40% 40% 5%;
          line-height: 1;
        }

        /*Row 1*/
        header h1 {
            font-size: clamp(3.0em, 10vw, 3.25rem);  
        }

        /*Row 2*/
        section img {
          height: 75%;
        }

        /*Row 3*/
        nav ul li a {
          font-size: 4rem;
        }
        
        /*Row 4*/
        footer ul li img {
          width: 75%;
        }

      }

      /*Medium screen support*/
      @media screen and (min-width:712px) {
        body {
          /* background-color: #5413a8; */
          grid-template-rows: 20% 50% 20% 5%;
        }
        /*Row 1*/
        header h1 {
          font-size: 5.0rem;
        }

        /*Row 2*/
        section h2 {
          font-size: 3.0rem;
        }

        section h2 p {
          font-size: 2.0rem;
        }

        section img {
          height: 75%;
        }

        /*Row 3*/
        nav ul li a {
          font-size: 2.0rem;
        }

        /*Row 4*/
        footer ul li img {
          width: 50%;
        }
      }

      /* Large screen support*/
      @media screen and (min-width:992px) {
        body {
          /* background-color: #c4a2a2; */
          grid-template-rows: 20% 60% 15% 5%;
        }

        /*Row 1*/
        header h1 {
          font-size: 5.0rem;
        }

        /*Row 2*/
        section h2 {
          font-size: 3.0rem;
        }

        section h2 p {
          font-size: 2.0rem;
        }

        section img {
          height: 75%;
        }

       /*Row 3*/
        nav ul {
          list-style: none;
          display: flex;
          flex-direction: row;
          align-items: center;
          justify-content: center;
          margin: 0 auto;
        }

        nav ul li {
          width: 40%;
          height: 90%;
          list-style: none;
          text-align: center;
          cursor: pointer;
          border-radius: 8px;
          transition: 0.3s;
          margin: 1.5%;
          display: flex;
          justify-content: center;
          align-items: center;
        }

        nav ul li a {
          font-size: 3.0rem;
        }

        /*Row 4*/
        footer ul li img {
          width: 20%;
        }
      }
      
    </style>
  </head>
  <body>

    <!-- Row 1 -->
    <header>
      <h1>I am... <br>
        <span class="fadeIn">Haden Walton</span>
      </h1>
    </header>

    <!-- Row 2 -->
    <section class="fadeInLate">
      <h2>I like to make programs.<br>
        <span class="roundAbout">C++ | Java | SQL</span>
      </h2>
    </section>

    <!-- Row 3 -->
    <nav class="fadeInLater">
      <hr>
      <ul>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="about.html">About Me</a></li>
      </ul>
      <hr>
    </nav>

    <!-- Row 4 -->
    <footer class="fadeInLater">
      <ul>
        <li><a href="https://www.linkedin.com/in/haden-w-87440617a/"><img src="Images/linkedin-brands-solid.png" alt="LinkedIn"></a></li>
        <li><a href="https://github.com/HadenWalton12"><img src="Images/GitHub_Invertocat_Black_Clearspace.png" alt="Github"></a></li>
        <li><a href="mailto:h_walton@fanshaweonline.ca"><img src="Images/email.png" alt="Email"></a></li>
      </ul>
    </footer>

  </body>
</html>
